name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$SDK/tools/bin"; fi
          echo "$SDKMGR" >> "$GITHUB_PATH"
          export PATH="$SDKMGR:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses > /dev/null
          sdkmanager --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: santali-speaks-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
